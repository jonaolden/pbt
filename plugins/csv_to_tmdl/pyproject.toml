[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-to-tmdl"
version = "0.1.0"
description = "Convert an INFORMATION_SCHEMA.COLUMNS-style CSV export into Power BI TMDL table files. pbt plugin."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
csv-to-tmdl = "csv_to_tmdl.cli:main"

[tool.setuptools.packages.find]
include = ["csv_to_tmdl*"]
